packages:
  - apps/*
  - packages/*
  - prototypes/*
  - tools/*

# `prefer` makes `vp add` reach for a catalog entry when one exists, so a second
# package cannot silently land on a different version of a shared dependency.
catalogMode: prefer

# One version of every shared dependency, named once. Packages depend on
# `catalog:` and never on a version range, so an upgrade is a one-line edit here.
catalog:
  "@commitlint/cli": ^21.2.1
  "@commitlint/config-conventional": ^21.2.0
  "@effect/platform-bun": 4.0.0-rc.110
  "@effect/platform-node": 4.0.0-rc.110
  "@effect/tsgo": 0.36.5
  "@effect/vitest": 4.0.0-rc.110
  "@types/node": ^24
  alchemy: 2.0.0-beta.72
  effect: 4.0.0-rc.110
  oxlint: 1.77.0
  oxlint-tsgolint: 7.0.2001
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9
  vitest: 4.1.10

# Vite+ ships its own Vite core under an alias; the override keeps every
# transitive `vite` on that same build rather than the public package.
#
# `@effect/platform-bun` is here for a different reason: nothing declares it, and
# pnpm installs it anyway because `alchemy` names it an optional peer. It cannot be
# excluded — `ignoredOptionalDependencies` does not reach optional peers — so the
# choice is a pinned copy or an unpinned one. Unpinned, its range
# (`>=4.0.0-beta.105 || >=4.0.0`) is free to resolve to a build that disagrees with
# `effect@4.0.0-rc.110` and put a second Effect in the tree. On Node it is the branch
# `Util/PlatformServices.ts` never takes, so the copy costs nothing but disk.
overrides:
  "@effect/platform-bun": "catalog:"
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

minimumReleaseAgeExclude:
  - effect@4.0.0-rc.110
  - "@effect/vitest@4.0.0-rc.110"
  - "@effect/platform-bun@4.0.0-rc.110"
  - "@effect/platform-node@4.0.0-rc.110"
  - alchemy@2.0.0-beta.72

allowBuilds:
  msgpackr-extract: false
  sharp: true
  workerd: true
